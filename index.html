git <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Calculator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator">
    <h1>Smart Calculator</h1>
    <div id="history"></div>
    <input type="text" id="display">

    <div class="buttons">
        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>
        <button onclick="press('^')">^</button>
        <button onclick="backspace()">⌫</button>
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="equal" onclick="calculate()">=</button>

        <button onclick="press('sin(')">sin</button>
        <button onclick="press('cos(')">cos</button>
        <button onclick="press('tan(')">tan</button>
        <button onclick="press('cot(')">cot</button>
        <button onclick="press('log10(')">log</button>
        <button class="operator" onclick="press('+')">+</button>

        <button onclick="press('.')">.</button>
        <button onclick="press('sqrt(')">√</button>
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('-')">-</button>

        <button onclick="press('pi')">π</button>
        <button onclick="press('e')">e</button>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('*')">*</button>

        <button onclick="press('abs(')">|x|</button>
        <button onclick="press('exp(')">exp</button>
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="operator" onclick="press('/')">/</button>

        <button onclick="checkEven()">Even</button>
        <button onclick="checkOdd()">Odd</button>
        <button onclick="press('0')">0</button>
        <button onclick="calculatePercentage()">%</button>
        <button onclick="useAns()">ANS</button>
        <button onclick="toggleTheme()">🌙</button>

        <button onclick="checkPrime()">Prime</button> 
        <button onclick="checkComposite()">Composite</button> 
        <button class="mode" onclick="toggleMode()">DEG</button>                
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
